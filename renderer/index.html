<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://shineai-9mr.pages.dev data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-src https://shineai-9mr.pages.dev; media-src 'self' blob: https:;" />
  <title>Shine Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- ================= TITLE BAR ================= -->
    <div id="titleBar">
      <div class="brand" id="brandBtn" title="New tab">
        <span>Shine Browser</span>
      </div>

      <!-- Safari-style floating control cluster (from the Shine UI) -->
      <div class="control-cluster" id="controlCluster">
        <button class="icon-btn" id="btnSidebar" title="Show sidebar">
          <svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><line x1="9.5" y1="4" x2="9.5" y2="20"/></svg>
        </button>
        <button class="icon-btn" id="btnSplit" title="Split screen with Shine">
          <svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><line x1="13" y1="4" x2="13" y2="20"/><path d="M6.5 12h3M16.5 9.5 19 12l-2.5 2.5"/></svg>
        </button>
        <button class="icon-btn" id="btnFind" title="Search / Find in page">
          <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
        </button>
        <button class="cluster-btn" id="btnShine" title="Ask Shine">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M4 12h5M15 12h5M12 4v5M12 15v5"/><circle cx="12" cy="12" r="2.6"/></svg>
          <span>Ask Shine</span>
        </button>
      </div>

      <div class="window-controls" id="windowControls">
        <button class="wc" id="wcMin" title="Minimize"><svg viewBox="0 0 12 12"><line x1="1" y1="6" x2="11" y2="6"/></svg></button>
        <button class="wc" id="wcMax" title="Maximize"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" rx="1"/></svg></button>
        <button class="wc wc-close" id="wcClose" title="Close"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
      </div>
    </div>

    <!-- ================= TAB STRIP ================= -->
    <div id="tabStrip">
      <div id="tabs" role="tablist"></div>
      <button id="newTabBtn" title="New tab (Ctrl+T)">
        <svg class="svg-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <div id="tabActions">
        <button class="icon-btn" id="btnTabSearch" title="Search tabs">
          <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
        </button>
      </div>
    </div>

    <!-- ================= TOOLBAR ================= -->
    <div id="toolbar">
      <button class="icon-btn nav-btn" id="btnBack" title="Back (Alt+←)">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M14.5 5 8 12l6.5 7"/></svg>
      </button>
      <button class="icon-btn nav-btn" id="btnForward" title="Forward (Alt+→)">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M9.5 5 16 12l-6.5 7"/></svg>
      </button>
      <button class="icon-btn nav-btn" id="btnReload" title="Reload (Ctrl+R)">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v4.5h-4.5"/></svg>
      </button>

      <!-- Safari-style omnibox -->
      <div id="omniWrap">
        <div id="omni">
          <svg class="svg-icon omni-lock" id="omniIcon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
          <input id="omnibox" type="text" autocomplete="off" spellcheck="false"
                 placeholder="Search or enter website" />
          <button class="icon-btn omni-star" id="btnBookmark" title="Add favorite (Ctrl+D)">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1Z"/></svg>
          </button>
        </div>
      </div>

      <!-- Find bar lives INSIDE the toolbar strip so the page can never
           paint over it (the content views start below the chrome). -->
      <div id="findBar" class="find-bar hidden">
        <input id="findInput" placeholder="Find in page" />
        <span id="findCount"></span>
        <button class="icon-btn sm" id="findPrev" title="Previous"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></svg></button>
        <button class="icon-btn sm" id="findNext" title="Next"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></svg></button>
        <button class="icon-btn sm" id="findClose" title="Close"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>

      <div class="toolbar-right">
        <button class="tool-chip" id="btnPC" title="PC Control — launch apps, see system info, take a screenshot">
          <svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span>PC Control</span>
        </button>
        <button class="tool-chip" id="btnBrowser" title="Browser Control — drive this browser with Shine">
          <svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><line x1="3" y1="9" x2="21" y2="9"/><circle cx="6.5" cy="6.5" r=".6"/><circle cx="9" cy="6.5" r=".6"/></svg>
          <span>Browser</span>
        </button>
        <span class="tool-sep"></span>
        <button class="icon-btn" id="btnExtensions" title="Extensions">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M10 3.5a2.5 2.5 0 0 1 5 0V6h3a1 1 0 0 1 1 1v3h2.5a2.5 2.5 0 0 1 0 5H19v3a1 1 0 0 1-1 1h-3v-2.5a2.5 2.5 0 0 0-5 0V19H7a1 1 0 0 1-1-1v-3H3.5a2.5 2.5 0 0 1 0-5H6V7a1 1 0 0 1 1-1h3V3.5Z"/></svg>
        </button>
        <button class="icon-btn" id="btnDownloads" title="Downloads">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M8 11.5 12 15.5l4-4"/><path d="M5 19h14"/></svg>
        </button>
        <button class="icon-btn" id="btnHistory" title="History (Ctrl+H)">
          <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg>
        </button>
        <button class="icon-btn" id="btnFavorites" title="Favorites">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1Z"/></svg>
        </button>
        <button class="icon-btn" id="btnProfile" title="Profile">
          <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1.4-3.4 4-5 7-5s5.6 1.6 7 5"/></svg>
        </button>
        <button class="icon-btn" id="btnMenu" title="Menu">
          <svg class="svg-icon" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>
      </div>
    </div>

    <!-- ================= CONTENT ================= -->
    <div id="content">
      <div id="webArea"></div>

      <!-- Shine split-screen panel -->
      <div id="shinePanel" class="hidden">
        <div id="shineHead">
          <div class="shine-head-brand">
            <span>Shine</span>
          </div>
          <div class="shine-head-actions">
            <button class="icon-btn sm" id="shineAskSel" title="Ask Shine about my selection">
              <span class="mini-label">Ask</span>
            </button>
            <button class="icon-btn sm" id="shineMax" title="Maximize panel">
              <svg class="svg-icon" viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>
            </button>
            <button class="icon-btn sm" id="shineClose" title="Close Shine">
              <svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </div>
        </div>
        <div id="shineHost"></div>
      </div>
    </div>

    <!-- ================= SIDE PANELS (these push the page aside) ====== -->
    <div id="panelHistory" class="side-panel hidden">
      <div class="panel-head">
        <span>History</span>
        <div>
          <button class="btn-link" id="clearHistory">Clear all</button>
          <button class="icon-btn sm panel-close" data-close="panelHistory"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
      </div>
      <div class="panel-search"><input id="historySearch" placeholder="Search history" /></div>
      <div class="panel-body" id="historyList"></div>
    </div>

    <div id="panelFavorites" class="side-panel hidden">
      <div class="panel-head">
        <span>Favorites</span>
        <div>
          <button class="btn-link" id="importBookmarks">Import</button>
          <button class="icon-btn sm panel-close" data-close="panelFavorites"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
      </div>
      <div class="panel-body" id="favoritesList"></div>
    </div>

    <div id="panelDownloads" class="side-panel hidden">
      <div class="panel-head">
        <span>Downloads</span>
        <div>
          <button class="btn-link" id="openDownloadsFolder">Open folder</button>
          <button class="icon-btn sm panel-close" data-close="panelDownloads"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
      </div>
      <div class="panel-body" id="downloadsList"></div>
    </div>

    <div id="panelExtensions" class="side-panel hidden">
      <div class="panel-head">
        <span>Extensions</span>
        <button class="icon-btn sm panel-close" data-close="panelExtensions"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="panel-actions">
        <button class="btn-primary sm" id="extLoad">Load unpacked</button>
        <button class="btn-ghost sm" id="extStore">Chrome Web Store</button>
      </div>
      <div class="panel-body" id="extensionsList"></div>
      <div class="panel-foot">Extensions run with full Chrome compatibility. Install any .crx from the Chrome Web Store.</div>
    </div>

    <div id="panelPC" class="side-panel wide hidden">
      <div class="panel-head">
        <span>PC Control</span>
        <button class="icon-btn sm panel-close" data-close="panelPC"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="panel-tabs" id="pcTabs">
        <button class="active" data-pc="apps">Apps</button>
        <button data-pc="system">System</button>
        <button data-pc="processes">Processes</button>
      </div>
      <div class="panel-actions">
        <input id="pcSearch" placeholder="Search installed apps…" />
        <button class="btn-ghost sm" id="pcScreenshot">Screenshot</button>
      </div>
      <div class="panel-body" id="pcBody"></div>
      <div class="panel-actions">
        <div class="panel-label">Ask Shine to control your PC</div>
        <input id="pcAsk" placeholder="e.g. open notepad, take a screenshot, launch chrome" />
        <button class="btn-primary sm" id="pcAskBtn">Ask Shine</button>
      </div>
    </div>

    <!-- ================= BROWSER CONTROL ================= -->
    <div id="panelBrowser" class="side-panel wide hidden">
      <div class="panel-head">
        <span>Browser Control</span>
        <button class="icon-btn sm panel-close" data-close="panelBrowser"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="panel-actions">
        <button class="btn-ghost sm" data-bc="new-tab">New tab</button>
        <button class="btn-ghost sm" data-bc="reload">Reload</button>
        <button class="btn-ghost sm" data-bc="back">Back</button>
        <button class="btn-ghost sm" data-bc="forward">Forward</button>
        <button class="btn-ghost sm" data-bc="private">Private</button>
        <button class="btn-ghost sm" data-bc="bookmark">Bookmark</button>
      </div>
      <div class="panel-body">
        <div class="panel-label">Open tabs</div>
        <div id="bcTabs"></div>
        <div class="panel-label">Ask Shine to drive the browser</div>
        <div class="panel-actions">
          <input id="bcAsk" placeholder="e.g. open youtube and search for lofi" />
          <button class="btn-ghost sm" id="bcAskBtn">Ask</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/omnibox.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/selection.js"></script>
  <script src="js/shine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
