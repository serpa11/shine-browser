<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:;" />
  <title>Shine Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { background: transparent; overflow: hidden; height: 100%; }
    #stage { position: absolute; inset: 0; }
    .ov { position: absolute; left: 0; top: 0; visibility: hidden; pointer-events: none; }
    .ov.on { visibility: visible; pointer-events: auto; }
    #settingsWindow { position: absolute; inset: 0; }
    /* Download checker */
    .download-checker {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; border-radius: 10px;
      background: rgba(12,12,12,.92); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 14px 40px rgba(0,0,0,.6);
      color: #fff; font-family: Inter, sans-serif;
    }
    .dl-icon { font-size: 16px; }
    .dl-info { display: flex; flex-direction: column; gap: 2px; }
    .dl-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dl-prog { width: 140px; height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
    .dl-bar { height: 100%; background: #fff; border-radius: 3px; transition: width .2s ease; }
    .dl-pct { font-size: 11px; color: rgba(255,255,255,.7); }
    /* Settings */
    #settingsWindow .overlay-inner { max-width: 640px; padding: 40px 24px 120px; }
    .color-picker-row { display: flex; align-items: center; gap: 12px; }
    .color-preview { width: 24px; height: 24px; border: 1px solid rgba(255,255,255,.2); border-radius: 6px; cursor: pointer; }
    .cursor-row { display: flex; align-items: center; gap: 12px; }
    .cursor-preview { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); cursor: pointer; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="selectionBar" class="ov"></div>
    <div id="contextMenu" class="menu ov"></div>
    <div id="mainMenu" class="menu ov"></div>
    <div id="omniSuggestions" class="omni-sug-panel ov"></div>
    <div id="toast" class="toast-pill ov"></div>
    <div id="downloadChecker" class="download-checker ov"></div>
    <div id="settingsWindow" class="overlay ov">
      <div class="overlay-inner">
        <div class="overlay-head">
          <h2>Settings</h2>
          <button class="icon-btn" id="closeSettings"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="settings-group">
          <h3>Appearance</h3>
          <div class="color-picker-row">
            <label>Theme color:</label>
            <input type="color" id="setThemeColor" value="#000000" />
            <div class="color-preview" id="themeColorPreview" style="background:#000000"></div>
          </div>
          <div class="color-picker-row">
            <label>Accent color:</label>
            <input type="color" id="setAccentColor" value="#ffffff" />
            <div class="color-preview" id="accentColorPreview" style="background:#ffffff"></div>
          </div>
          <div class="cursor-row">
            <label>Mouse cursor:</label>
            <select id="setCursorStyle">
              <option value="auto">Default</option>
              <option value="crosshair">Crosshair</option>
              <option value="pointer">Pointer</option>
              <option value="help">Help</option>
              <option value="wait">Wait</option>
              <option value="progress">Progress</option>
              <option value="not-allowed">Not Allowed</option>
              <option value="zoom-in">Zoom In</option>
              <option value="zoom-out">Zoom Out</option>
              <option value="grab">Grab</option>
              <option value="grabbing">Grabbing</option>
            </select>
            <div class="cursor-preview" id="cursorPreview" style="background:transparent"></div>
          </div>
          <div class="row">
            <label>Enable Shine AI:</label>
            <input type="checkbox" id="setAiEnabled" />
          </div>
        </div>
        <div class="settings-group">
          <h3>Virus Blocker</h3>
          <div class="row">
            <span>Block known malicious URLs</span>
            <span class="status-badge">Active</span>
          </div>
        </div>
        <div class="settings-group">
          <h3>Time Checker</h3>
          <div id="timeDisplay" class="about">--:--:--</div>
        </div>
        <div class="settings-group">
          <h3>About</h3>
          <div class="about" id="aboutBox">Loading…</div>
          <button class="btn-ghost sm" id="reRunSetup">Re-run installer / shortcuts</button>
        </div>
      </div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
