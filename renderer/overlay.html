<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:;" />
  <title>Shine Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* The overlay is a transparent view whose bounds hug the widget it is
       showing, so nothing here may paint a full-window backdrop. */
    html, body { background: transparent; overflow: hidden; height: 100%; }
    #stage { position: absolute; inset: 0; }
    .ov {
      position: absolute; left: 0; top: 0;
      visibility: hidden; pointer-events: none;
    }
    .ov.on { visibility: visible; pointer-events: auto; }
    /* settings is modal inside its own bounds */
    #settingsWindow { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <div id="stage">

    <!-- ================= SELECTION ACTION BAR ================= -->
    <div id="selectionBar" class="ov"></div>

    <!-- ================= GENERIC MENU (context + main) ========= -->
    <div id="contextMenu" class="menu ov"></div>
    <div id="mainMenu" class="menu ov"></div>

    <!-- ================= OMNIBOX SUGGESTIONS ==================== -->
    <div id="omniSuggestions" class="omni-sug-panel ov"></div>

    <!-- ================= TOAST ================================== -->
    <div id="toast" class="toast-pill ov"></div>

    <!-- ================= SETTINGS =============================== -->
    <div id="settingsWindow" class="overlay ov">
      <div class="overlay-inner">
        <div class="overlay-head">
          <h2>Settings</h2>
          <button class="icon-btn" id="closeSettings"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>

        <div class="settings-group">
          <h3>Search engine</h3>
          <select id="setSearchEngine" class="select">
            <option value="google">Google</option>
            <option value="bing">Bing</option>
            <option value="duckduckgo">DuckDuckGo</option>
            <option value="brave">Brave Search</option>
            <option value="ecosia">Ecosia</option>
            <option value="startpage">Startpage</option>
            <option value="youtube">YouTube</option>
          </select>
        </div>

        <div class="settings-group">
          <h3>On startup</h3>
          <select id="setStartup" class="select">
            <option value="homepage">Open Shine</option>
            <option value="newtab">Open new tab</option>
            <option value="last">Continue where you left off</option>
          </select>
        </div>

        <div class="settings-group">
          <h3>Downloads</h3>
          <div class="row">
            <span id="dlPath">Default downloads folder</span>
            <button class="btn-ghost sm" id="changeDl">Change</button>
          </div>
        </div>

        <div class="settings-group">
          <h3>Appearance</h3>
          <div class="row">
            <span>Shine split-screen width</span>
            <input type="range" id="setPanelWidth" min="25" max="75" value="42" />
          </div>
          <div class="row">
            <span>Open Shine on startup</span>
            <input type="checkbox" id="setPanelOpen" />
          </div>
        </div>

        <div class="settings-group">
          <h3>Profiles</h3>
          <div class="row">
            <span id="profileName">Person 1</span>
            <button class="btn-ghost sm" id="renameProfile">Rename</button>
          </div>
        </div>

        <div class="settings-group">
          <h3>About</h3>
          <div class="about" id="aboutBox">Loading…</div>
          <button class="btn-ghost sm" id="reRunSetup">Re-run installer / shortcuts</button>
        </div>
      </div>
    </div>

  </div>

  <script src="js/data.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
